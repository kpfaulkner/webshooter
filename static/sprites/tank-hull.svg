<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Top-down tank hull, pointing right (+x). Grayscale for runtime tinting. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ededed"/>
      <stop offset="0.5" stop-color="#cfcfcf"/>
      <stop offset="1" stop-color="#aeaeae"/>
    </linearGradient>
  </defs>

  <!-- Treads run front-to-back along the hull. -->
  <g fill="#454545" stroke="#2c2c2c" stroke-width="1">
    <rect x="8" y="6"  width="48" height="12" rx="3"/>
    <rect x="8" y="46" width="48" height="12" rx="3"/>
  </g>
  <!-- Tread segment lines. -->
  <g stroke="#6c6c6c" stroke-width="1.5" stroke-linecap="round">
    <line x1="14" y1="7"  x2="14" y2="17"/>
    <line x1="22" y1="7"  x2="22" y2="17"/>
    <line x1="30" y1="7"  x2="30" y2="17"/>
    <line x1="38" y1="7"  x2="38" y2="17"/>
    <line x1="46" y1="7"  x2="46" y2="17"/>
    <line x1="14" y1="47" x2="14" y2="57"/>
    <line x1="22" y1="47" x2="22" y2="57"/>
    <line x1="30" y1="47" x2="30" y2="57"/>
    <line x1="38" y1="47" x2="38" y2="57"/>
    <line x1="46" y1="47" x2="46" y2="57"/>
  </g>

  <!-- Hull body with a beveled nose toward +x. -->
  <path d="M12 18 H50 L60 32 L50 46 H12 a4 4 0 0 1 -4 -4 V22 a4 4 0 0 1 4 -4 Z"
        fill="url(#body)" stroke="#8a8a8a" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Side panel seams. -->
  <g stroke="#9a9a9a" stroke-width="1">
    <line x1="20" y1="20" x2="20" y2="44"/>
    <line x1="44" y1="20" x2="44" y2="44"/>
  </g>
</svg>
