<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Webshooter</title>
  <style>
    html, body { margin: 0; height: 100%; background: #11131a; color: #cdd; font-family: system-ui, sans-serif; }
    #wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px; }
    canvas { background: #1b1f2a; border: 1px solid #333; border-radius: 4px; cursor: pointer; }
    #hint { font-size: 13px; color: #889; }

    /* Join gate: shown on load until the player picks a game password. */
    #gate { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #11131a; z-index: 10; }
    #gate.hidden { display: none; }
    #gateForm { display: flex; flex-direction: column; gap: 12px; width: 320px; max-width: 80vw; background: #1b1f2a; border: 1px solid #333; border-radius: 8px; padding: 24px; text-align: center; }
    #gateForm h1 { margin: 0; font-size: 22px; }
    #gateForm p { margin: 0; font-size: 13px; color: #889; line-height: 1.4; }
    #gateForm input[type="text"] { padding: 10px; border-radius: 4px; border: 1px solid #333; background: #11131a; color: #cdd; font-size: 15px; }
    #gateForm button { padding: 10px; border-radius: 4px; border: none; background: #4cc9f0; color: #08121a; font-weight: 600; font-size: 15px; cursor: pointer; }
    #gateForm button:hover { background: #6fd6f5; }

    /* Control-scheme picker: two selectable cards. */
    #controls { display: flex; flex-direction: column; gap: 6px; text-align: left; }
    #controls > span { font-size: 13px; color: #889; }
    #controls label { display: flex; gap: 8px; align-items: flex-start; padding: 8px 10px; border: 1px solid #333; border-radius: 4px; cursor: pointer; }
    #controls label:hover { border-color: #4cc9f0; }
    #controls input { margin-top: 2px; accent-color: #4cc9f0; }
    #controls .opt-title { font-size: 14px; color: #cdd; }
    #controls .opt-desc { font-size: 12px; color: #889; line-height: 1.3; }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="game"></canvas>
    <div id="hint">click to lock mouse · move mouse to turn · W/S forward/back · A/D strafe · click or space to shoot · Esc to release</div>
  </div>
  <div id="gate">
    <form id="gateForm">
      <h1>Webshooter</h1>
      <p>Enter a game password. Everyone who uses the same password plays together in the same game.</p>
      <input id="password" type="text" placeholder="game password" autocomplete="off" maxlength="64" autofocus />
      <div id="controls">
        <span>Control method</span>
        <label>
          <input type="radio" name="control" value="turn" checked />
          <span>
            <span class="opt-title">Mouse turn</span><br />
            <span class="opt-desc">Mouse turns the tank · W/S forward/back · A/D strafe</span>
          </span>
        </label>
        <label>
          <input type="radio" name="control" value="crosshair" />
          <span>
            <span class="opt-title">Crosshair</span><br />
            <span class="opt-desc">Mouse aims a crosshair · W drives toward it · A/D strafe</span>
          </span>
        </label>
      </div>
      <button type="submit">Join game</button>
    </form>
  </div>
  <script src="game.js"></script>
</body>
</html>
